#!/usr/sbin/nft -f

flush ruleset

table inet filter {

    chain input {
        # Default policy: drop everything not explicitly permitted
        type filter hook input priority 0; policy drop;

        # Allow loopback traffic - required for local services to communicate
        iif "lo" accept comment "Allow loopback"

        # Allow established and related traffic - responses to our outbound connections
        ct state established,related accept comment "Allow established connections"

        # Drop invalid packets - malformed or out-of-state
        ct state invalid drop comment "Drop invalid packets"

        # ICMP - allow ping from the intnet subnet only
        ip protocol icmp icmp type echo-request ip saddr 192.168.100.0/24 accept comment "Allow ping from intnet"
        ip6 nexthdr icmpv6 accept comment "Allow ICMPv6 (required for IPv6)"

        # SSH - restrict to host-only management subnet only
        tcp dport 22 ip saddr 192.168.56.0/24 accept comment "SSH from host-only management network only"

        # HTTP - allow from intnet (redirect to HTTPS)
        tcp dport 80 ip saddr 192.168.100.0/24 accept comment "HTTP from intnet (redirect to HTTPS)"

        # HTTPS - allow from intnet
        tcp dport 443 ip saddr 192.168.100.0/24 accept comment "HTTPS from intnet"

        # WireGuard - allow from anywhere (needed for remote access - Week 9)
        # Commented out until Week 9 - uncomment when WireGuard is configured
        # udp dport 51820 accept comment "WireGuard VPN"
        udp dport 51820 ip saddr 192.168.100.0/24 accept comment "WireGuard VPN"
        ip protocol icmp icmp type echo-request ip saddr 10.10.0.0/24 accept comment "Allow ping via WireGuard"
        tcp dport 443 ip saddr 10.10.0.0/24 accept comment "HTTPS via WireGuard tunnel"

        # Log dropped packets - rate limited to avoid flooding logs during a scan
        limit rate 5/minute log prefix "nft-drop: " level warn

    }

    chain forward {
        # This machine does not route traffic between interfaces
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        # Allow all outbound traffic from this server
        type filter hook output priority 0; policy accept;
    }
}
